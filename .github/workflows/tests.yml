name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install ffmpeg (para os testes de pipeline)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install (caminho leve, sem torch)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        # O núcleo puro e o wiring rodam SEM a stack de GPU (torch/whisperx ausentes).
        run: pytest -q

      - name: Verify lazy-import boundary
        run: pytest -q tests/test_lazy_import.py

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for leaked secrets (HF/provider/GitHub tokens)
        run: bash scripts/scan_secrets.sh
